<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SWIR GitHub Standards</title>
  <desc id="desc">SWIR community and engineering standards, presented in a dark electric-cyan banner with a checklist icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="0.56" stop-color="#07111C"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="0.5" stop-color="#62E5FF"/>
      <stop offset="1" stop-color="#0088FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#62E5FF" stroke-opacity="0.28"/>
  <path d="M0 270C180 230 300 300 490 268S780 235 960 270S1110 275 1200 248" fill="none" stroke="url(#cyan)" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M940 45H1140" stroke="#62E5FF" stroke-opacity="0.16"/>
  <g transform="translate(68 72)">
    <rect width="156" height="156" rx="32" fill="#07111C" stroke="#62E5FF" stroke-opacity="0.55"/>
    <rect x="39" y="29" width="78" height="100" rx="12" fill="none" stroke="#62E5FF" stroke-width="3"/>
    <path d="M56 56L61 61L70 49M56 82L61 87L70 75" fill="none" stroke="#62E5FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M81 56H100M81 82H100M57 108H100" stroke="#0088FF" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="270" y="69" font-size="18" font-weight="700" letter-spacing="4" fill="#62E5FF">SWIR / ENGINEERING</text>
    <text x="270" y="145" font-size="54" font-weight="800" fill="#F4FAFF">GITHUB STANDARDS</text>
    <text x="272" y="190" font-size="24" font-weight="500" fill="#B8D2E0">Shared standards. A consistent project experience.</text>
    <text x="272" y="232" font-size="16" font-weight="600" letter-spacing="1.4" fill="#62E5FF">ISSUES  ·  CONTRIBUTIONS  ·  SECURITY  ·  SUPPORT</text>
  </g>
